<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redireccionando...</title>
    <!-- Redirección automática inmediata -->
    <meta http-equiv="refresh" content="0; url=https://www.instagram.com/elhellman._/">
    <link rel="canonical" href="https://www.instagram.com/elhellman._/">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        p {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.8;
        }
        a {
            color: #E1306C; /* Color rosa oficial de Instagram */
            text-decoration: none;
            font-weight: bold;
            border-bottom: 2px solid #E1306C;
            padding-bottom: 2px;
            transition: opacity 0.2s;
        }
        a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>Redireccionando al sitio...</p>
        <p>Si no ingresas automáticamente, <a href="https://www.instagram.com/elhellman._/">haz clic aquí</a>.</p>
    </div>
</body>
</html>
